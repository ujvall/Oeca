[package]
name = "Oeca"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
# Already a dependency of `windows` (same version); named directly because the
# `#[implement]` COM macro (the OLE drop target) expands to `windows_core::` paths.
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_Globalization",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Media_Control",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Graphics_Imaging",
    "System_Threading",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Com_StructuredStorage",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Dwm",
    "Win32_System_Variant",
    # Session-scoped clipboard history: the volatile session key and the
    # logon session id (clipboard_store.rs)
    "Win32_System_Registry",
    "Win32_Security",
] }
