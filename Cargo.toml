[package]
name = "Oeca"
version = "0.4.0"
edition = "2024"
license = "MIT"

[dependencies]
# Already a dependency of `windows` (same version); named directly because the
# `#[implement]` COM macro (the OLE drop target) expands to `windows_core::` paths.
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_Globalization",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Media_Control",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Graphics_Imaging",
    "System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Com_StructuredStorage",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Dwm",
    "Win32_System_Variant",
    # Session-scoped clipboard history: the volatile session key and the
    # logon session id (clipboard_store.rs)
    "Win32_System_Registry",
    "Win32_Security",
    # Single instance (a per-session named mutex), and the animation frame
    # clock (a thread-pool timer): window.rs
    "Win32_System_Threading",
    # The animation clock: QueryPerformanceCounter, DWM's vblank timebase
    "Win32_System_Performance",
    # Volume HUD: the master volume (hud.rs)
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    # Battery / Energy Saver state and notifications (window.rs)
    "Win32_System_Power",
    # Update availability: one HTTPS request to GitHub's releases API (update.rs)
    "Win32_Networking_WinHttp",
] }

# Offline image / audio conversion (src/convert.rs). Pure Rust, only the
# formats Oeca converts; licences recorded in THIRD-PARTY-NOTICES.txt.
[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"]

[dependencies.symphonia]
version = "0.5"
default-features = false
features = ["mp3", "flac", "vorbis", "wav", "pcm", "aac", "isomp4", "ogg", "alac"]

[dependencies.flacenc]
version = "0.5"
default-features = false

[dependencies.vorbis_rs]
version = "0.5"
default-features = false

# AVIF input (decode only). The vendored copy of avif-decode (BSD-3-Clause) is
# unmodified except that its rav1d dependency (a Rust port of dav1d,
# BSD-2-Clause) is built without NASM assembly; see vendor/avif-decode/Cargo.toml.
[dependencies.avif-decode]
path = "vendor/avif-decode"
default-features = false

[dependencies.avif-parse]
version = "2.1"
