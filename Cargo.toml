[package]
name = "Oeca"
version = "0.5.0"
edition = "2024"
license = "MIT"

[dependencies]
# Already a dependency of `windows` (same version); named directly because the
# `#[implement]` COM macro (the OLE drop target) expands to `windows_core::` paths.
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_Globalization",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Media_Control",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Graphics_Imaging",
    "System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Com_StructuredStorage",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Dwm",
    "Win32_System_Variant",
    # Start on launch (startup.rs)
    "Win32_System_Registry",
    # Session-scoped clipboard history: the Windows sign-in (clipboard_store.rs)
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_System_RemoteDesktop",
    # The data folder's physical path, checked before any write (data_dir.rs)
    "Win32_Storage_FileSystem",
    # Single instance (a per-session named mutex), and the animation frame
    # clock (a thread-pool timer): window.rs
    "Win32_System_Threading",
    # The animation clock: QueryPerformanceCounter, DWM's vblank timebase
    "Win32_System_Performance",
    # Volume HUD: the master volume (hud.rs)
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    # Volume buttons on a headset's inline remote: HID report usages (hud.rs)
    "Win32_Devices_HumanInterfaceDevice",
    # Battery / Energy Saver state and notifications (window.rs)
    "Win32_System_Power",
    # Update availability: one HTTPS request to GitHub's releases API (update.rs)
    "Win32_Networking_WinHttp",
    # Nearby: the device identity key at rest, DPAPI-protected (nearby.rs)
    "Win32_Security_Cryptography",
    # Nearby: reconnect when an IP address comes or goes (nearby.rs)
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

# Offline image / audio conversion (src/convert.rs). Pure Rust, only the
# formats Oeca converts; licences recorded in THIRD-PARTY-NOTICES.txt.
[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"]

[dependencies.symphonia]
version = "0.5"
default-features = false
features = ["mp3", "flac", "vorbis", "wav", "pcm", "aac", "isomp4", "ogg", "alac"]

[dependencies.flacenc]
version = "0.5"
default-features = false

[dependencies.vorbis_rs]
version = "0.5"
default-features = false

# AVIF input (decode only). The vendored copy of avif-decode (BSD-3-Clause) is
# unmodified except that its rav1d dependency (a Rust port of dav1d,
# BSD-2-Clause) is built without NASM assembly; see vendor/avif-decode/Cargo.toml.
[dependencies.avif-decode]
path = "vendor/avif-decode"
default-features = false

[dependencies.avif-parse]
version = "2.1"

# Nearby (src/nearby.rs): the official LocalSend Rust core (signaling client,
# WebRTC peer, token exchange, transfer), vendored with small patches at the commit
# verified in Phase 1 (26cc8f9; see vendor/localsend-core/OECA-VENDOR.txt: a
# git dependency would check out LocalSend's Flutter submodule). Only `webrtc`;
# `pem` because that feature alone does not build upstream (crypto/cert.rs).
# Apache-2.0; its tree is listed in THIRD-PARTY-NOTICES.txt. Tokio hosts it on
# one dedicated thread; flate2 (already in the core's tree) inflates SDPs for
# the connection's verification code.
[dependencies.localsend]
path = "vendor/localsend-core"
default-features = false
features = ["webrtc", "pem"]

[dependencies.tokio]
version = "1.53"
default-features = false
features = ["rt", "time", "sync", "macros"]  # the core itself enables "full"

[dependencies.flate2]
version = "1.1"

# Already in the core's tree (its WebRTC stack): named for the persistent
# DTLS certificate (RTCCertificate PEM, needs "pem"), Nearby's device identity.
[dependencies.webrtc]
version = "0.14"
default-features = false
features = ["pem"]

# Nearby: dtls (webrtc's DTLS), vendored to negotiate X25519 only; see
# vendor/dtls/OECA-VENDOR.txt
[patch.crates-io]
dtls = { path = "vendor/dtls" }
